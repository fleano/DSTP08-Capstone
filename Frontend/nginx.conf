server {
    # Listen for HTTP traffic inside the frontend container.
    listen 80;
    server_name _;

    # Serve the files copied from the Vite build stage.
    root /usr/share/nginx/html;
    index index.html;

    # Allow requests that upload larger menu images.
    client_max_body_size 20m;

    # Forward /api/... to the backend and remove the /api prefix expected only by the frontend.
    location /api/ {
        proxy_pass http://backend:3000/;
        # Forward request metadata so the backend can identify the original request.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static assets directly and send client-side routes to the React application.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
